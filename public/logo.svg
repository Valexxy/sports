<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="goldFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>
    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF" />
      <stop offset="100%" stop-color="#14F195" />
    </linearGradient>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A1826" />
      <stop offset="70%" stop-color="#040911" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cosmic Football Core -->
  <circle cx="256" cy="256" r="236" fill="url(#ballGlow)" stroke="#00E676" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Orbital Stadium Pitch Rings -->
  <ellipse cx="256" cy="256" rx="220" ry="110" fill="none" stroke="url(#neonEmerald)" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-25 256 256)" filter="url(#glow)" opacity="0.85" />
  <ellipse cx="256" cy="256" rx="220" ry="110" fill="none" stroke="url(#goldFire)" stroke-width="3" stroke-dasharray="8 14" transform="rotate(35 256 256)" opacity="0.6" />

  <!-- Geometric Football Seams & Facets (Futuristic Cyber Ball) -->
  <g stroke="url(#neonEmerald)" stroke-width="4" fill="none" opacity="0.45">
    <!-- Center Pentagon -->
    <polygon points="256,160 320,205 295,280 217,280 192,205" fill="#00E676" fill-opacity="0.12" stroke="url(#neonEmerald)" stroke-width="5" />
    <!-- Connecting Facet Lines -->
    <line x1="256" y1="160" x2="256" y2="80" />
    <line x1="320" y1="205" x2="390" y2="160" />
    <line x1="295" y1="280" x2="370" y2="340" />
    <line x1="217" y1="280" x2="142" y2="340" />
    <line x1="192" y1="205" x2="122" y2="160" />
    <!-- Outer Arc Hexagons -->
    <polygon points="256,80 340,95 390,160 320,205 256,160" />
    <polygon points="192,205 256,160 256,80 172,95 122,160" />
    <polygon points="295,280 370,340 340,410 256,430 217,280" />
  </g>

  <!-- Crown Apex on Top of Football -->
  <path d="M 180,95 L 210,40 L 256,75 L 302,40 L 332,95 Z" fill="url(#goldFire)" stroke="#FFF59D" stroke-width="3" filter="url(#glow)" />
  <circle cx="210" cy="38" r="6" fill="#FFF" />
  <circle cx="256" cy="73" r="7" fill="#00FFA3" />
  <circle cx="302" cy="38" r="6" fill="#FFF" />

  <!-- Slicing Central Kinetic Lightning Bolt ⚡ -->
  <polygon points="290,60 170,250 250,250 210,450 355,220 270,220" fill="url(#goldFire)" stroke="#FFF" stroke-width="4" filter="url(#strongGlow)" />
  <polygon points="280,80 185,245 255,245 225,415 335,228 275,228" fill="#FFFFFF" opacity="0.9" />

  <!-- Radiant Football Goal Sparks -->
  <circle cx="160" cy="180" r="4" fill="#00FFA3" filter="url(#glow)" />
  <circle cx="360" cy="180" r="5" fill="#FFD700" filter="url(#glow)" />
  <circle cx="330" cy="360" r="4" fill="#00FFA3" filter="url(#glow)" />
  <circle cx="180" cy="360" r="5" fill="#FF9100" filter="url(#glow)" />
</svg>