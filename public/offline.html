<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070B">
  <title>AuraScore | Offline Mode Active</title>
  <style>
    body {
      background-color: #05070B;
      color: #FFFFFF;
      font-family: monospace;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #0D1117;
      border: 1px solid rgba(0, 230, 118, 0.4);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .icon {
      font-size: 40px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 10px;
      color: #00E676;
      letter-spacing: 1px;
    }
    p {
      font-size: 12px;
      color: #8B949E;
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      background: #00E676;
      color: #000000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 14px;
      font-size: 12px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡📶</div>
    <h1>OFFLINE MODE ACTIVE</h1>
    <p>You are currently disconnected from the pitch, but your <strong>Aura Points, predictions, and slips are 100% safe</strong> in local cache.</p>
    <button class="btn" onclick="window.location.reload()">Reconnect Live Stadium ➔</button>
  </div>
</body>
</html>
