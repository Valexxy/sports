name: ⚡ Telegram Continuous Live Settlement (Every 15 Mins)

on:
  schedule:
    # Runs every 15 minutes 24/7 to instantly alert Telegram as each match finishes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  live-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📡 Trigger Real-Time Live Settlement Cron
        run: |
          echo "⚡ Triggering Mivaj live match settlement at $(date)"
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://mivaj.com/api/cron/telegram-live-settle" \
            -H "Accept: application/json" \
            -H "User-Agent: MivajCronBot/1.0" \
            --max-time 30)
          echo "Response code: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Live settlement triggered successfully!"
          else
            echo "⚠️ Warning: received status $response"
          fi
