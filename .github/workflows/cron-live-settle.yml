name: ⚡ Telegram Continuous Live Settlement (Every 15 Mins)

on:
  schedule:
    # Runs every 15 minutes 24/7 to instantly alert Telegram as each match finishes
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  live-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📡 Trigger Real-Time Live Settlement Cron
        run: |
          echo "⚡ Triggering Mivaj live match settlement at $(date)"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET || 'mivaj_secure_cron_2026' }}"
          
          # Try primary domain first, failover to direct Vercel deployment if blocked or slow
          response=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://mivaj.com/api/cron/telegram-live-settle" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "$AUTH_HEADER" \
            --max-time 90 || echo "000")
          
          echo "Primary domain response code: $response"
          cat response.json || true
          echo ""

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "⚠️ Primary domain returned $response. Retrying via direct Vercel origin..."
            response_fallback=$(curl -s -o response_fallback.json -w "%{http_code}" \
              -X GET "https://aurascore-ai.vercel.app/api/cron/telegram-live-settle" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              -H "$AUTH_HEADER" \
              --max-time 90 || echo "000")
            echo "Vercel origin response code: $response_fallback"
            cat response_fallback.json || true
          fi

          echo "✅ Continuous live settlement cycle completed."
