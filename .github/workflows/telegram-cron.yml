name: Mivaj Sports — Telegram Auto-Post Cron

on:
  schedule:
    # Early morning banker check (4:30 AM & 6:30 AM WAT) — posts ahead of early kickoffs
    - cron: '30 3,5 * * *'
    # Breaking sports news broadcast — 12:00 PM and 6:00 PM WAT (11:00 AM & 5:00 PM UTC)
    - cron: '0 11,17 * * *'
    # Daily Facebook Page tipsbrosNG Auto-Post — 8:00 AM WAT (7:00 AM UTC)
    - cron: '0 7 * * *'
    # Daily automated high-DA guest posting & search engine indexing — 9:00 AM WAT (8:00 AM UTC)
    - cron: '0 8 * * *'
    # Live settlement check — every 30 min from 3PM to 11PM UTC (4PM-12AM WAT)
    - cron: '*/30 15-23 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: false
        default: 'morning-broadcast'
        type: choice
        options:
          - morning-broadcast
          - live-settle
          - breaking-news
          - syndicate-guest-post
          - facebook-page-post

jobs:
  morning-broadcast:
    if: github.event.schedule == '30 5 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'morning-broadcast' || github.event.inputs.job == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger Morning Banker Broadcast with 3-Stage Retry
        id: broadcast
        run: |
          MAX_RETRIES=3
          DELAY=45
          SUCCESS=0
          SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$SECRET" ]; then
            echo "::warning::CRON_SECRET is not configured in GitHub Secrets. Using fallback authorization."
            AUTH_HEADER=""
          else
            AUTH_HEADER="Authorization: Bearer $SECRET"
          fi

          for i in $(seq 1 $MAX_RETRIES); do
            echo "--- Attempt $i of $MAX_RETRIES to trigger Telegram Morning Broadcast ---"
            
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              --max-time 90 \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              "https://mivaj.com/api/cron/telegram-morning" || echo "000")

            echo "Primary Status: $HTTP_CODE"
            cat response.txt || true
            echo ""

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Morning broadcast succeeded on attempt $i"
              SUCCESS=1
              break
            else
              echo "⚠️ Primary failed ($HTTP_CODE). Retrying via direct Vercel origin..."
              FALLBACK_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                --max-time 90 \
                ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
                "https://aurascore-ai.vercel.app/api/cron/telegram-morning" || echo "000")
              echo "Fallback Status: $FALLBACK_CODE"
              cat response.txt || true
              if [ "$FALLBACK_CODE" = "200" ]; then
                echo "✅ Succeeded via direct Vercel deployment!"
                SUCCESS=1
                break
              fi
              if [ $i -lt $MAX_RETRIES ]; then
                sleep $DELAY
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::warning::Telegram Morning Broadcast could not complete. Will retry next scheduled interval."
          fi

  live-settle:
    if: github.event.schedule == '*/30 15-23 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'live-settle')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Live Match Settlement with 3-Stage Retry
        run: |
          MAX_RETRIES=3
          DELAY=20
          SUCCESS=0
          SECRET="${{ secrets.CRON_SECRET }}"

          if [ -z "$SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer mivaj_secure_cron_2026"
          else
            AUTH_HEADER="Authorization: Bearer $SECRET"
          fi

          for i in $(seq 1 $MAX_RETRIES); do
            echo "--- Attempt $i of $MAX_RETRIES for Live Settlement ---"

            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              --max-time 90 \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              "https://mivaj.com/api/cron/telegram-live-settle" || echo "000")

            echo "Primary Status: $HTTP_CODE"
            cat response.txt || true
            echo ""

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Live settle succeeded on attempt $i"
              SUCCESS=1
              break
            else
              echo "⚠️ Primary failed ($HTTP_CODE). Retrying via direct Vercel origin..."
              FALLBACK_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
                --max-time 90 \
                ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
                "https://aurascore-ai.vercel.app/api/cron/telegram-live-settle" || echo "000")
              echo "Fallback Status: $FALLBACK_CODE"
              cat response.txt || true
              if [ "$FALLBACK_CODE" = "200" ]; then
                echo "✅ Live settle succeeded via direct Vercel deployment!"
                SUCCESS=1
                break
              fi
              if [ $i -lt $MAX_RETRIES ]; then
                sleep $DELAY
              fi
            fi
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "::warning::Live settle finished with status $HTTP_CODE. Will retry next interval."
          fi

  breaking-news:
    if: github.event.schedule == '0 11,17 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'breaking-news')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger Breaking News Broadcast to Telegram
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer mivaj_secure_cron_2026"
          else
            AUTH_HEADER="Authorization: Bearer $SECRET"
          fi

          echo "--- Broadcasting Top Breaking Sports News to Telegram ---"
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            --max-time 60 \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            "https://mivaj.com/api/cron/telegram-news" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              --max-time 60 \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              "https://aurascore-ai.vercel.app/api/cron/telegram-news" || echo "000")
          fi

          echo "HTTP Status: $HTTP_CODE"
          cat response.txt || true
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Breaking news successfully broadcast to @mivajsport"
          else
            echo "::warning::News broadcast returned $HTTP_CODE"
          fi

  syndicate-guest-post:
    if: github.event.schedule == '0 8 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'syndicate-guest-post')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Automated Guest Blogging & Search Engine Indexing
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer mivaj_secure_cron_2026"
          else
            AUTH_HEADER="Authorization: Bearer $SECRET"
          fi

          echo "--- Publishing Automated High-DA Guest Article & Pinging IndexNow ---"
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            --max-time 60 \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            "https://mivaj.com/api/cron/syndicate" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              --max-time 60 \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              "https://aurascore-ai.vercel.app/api/cron/syndicate" || echo "000")
          fi

          echo "HTTP Status: $HTTP_CODE"
          cat response.txt || true
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Automated guest post published & IndexNow search engines notified"
          else
            echo "::warning::Syndication returned $HTTP_CODE"
          fi

  facebook-page-post:
    if: github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'facebook-page-post')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-Post Matchday Banker Radar to Facebook Page (tipsbrosNG)
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer mivaj_secure_cron_2026"
          else
            AUTH_HEADER="Authorization: Bearer $SECRET"
          fi

          echo "--- Auto-Posting Matchday Intelligence to facebook.com/tipsbrosNG ---"
          HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            --max-time 60 \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            "https://mivaj.com/api/cron/facebook-autopost" || echo "000")

          if [ "$HTTP_CODE" != "200" ]; then
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" -X GET \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              --max-time 60 \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
              "https://aurascore-ai.vercel.app/api/cron/facebook-autopost" || echo "000")
          fi

          echo "HTTP Status: $HTTP_CODE"
          cat response.txt || true
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Successfully auto-posted to facebook.com/tipsbrosNG"
          else
            echo "::warning::Facebook post returned $HTTP_CODE (check if Page token needs renewal)"
          fi


