name: 🌅 Telegram Morning Predictions (6AM WAT)

on:
  schedule:
    # 5:00 AM UTC = 6:00 AM WAT (Nigeria/West Africa Time)
    - cron: '0 5 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  send-morning-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📡 Trigger Morning Predictions Cron
        run: |
          echo "🌅 Triggering Mivaj morning predictions at $(date)"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET || 'mivaj_secure_cron_2026' }}"

          response=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://mivaj.com/api/cron/telegram-morning" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "$AUTH_HEADER" \
            --max-time 90 || echo "000")
          
          echo "Primary response code: $response"
          cat response.json || true
          echo ""

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "⚠️ Primary failed ($response). Retrying via direct Vercel origin..."
            curl -s -X GET "https://aurascore-ai.vercel.app/api/cron/telegram-morning" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              -H "$AUTH_HEADER" \
              --max-time 90 || true
          fi

      - name: 🔔 Also trigger daily data update
        run: |
          curl -s -X GET "https://mivaj.com/api/cron/daily" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-time 60 || echo "Daily sync triggered"
