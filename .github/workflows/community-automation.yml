name: Community & Triage Automation

on:
  issues:
    types: [opened]

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Greet & Acknowledge Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '👋 Thank you for reporting this to the AuraScore Stadium team! Our automated live settlement ledger and matchday systems have logged your report.'
            });
