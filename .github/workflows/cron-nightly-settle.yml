name: 🌙 Telegram Nightly Settlement (11PM WAT)

on:
  schedule:
    # 10:00 PM UTC = 11:00 PM WAT (Nigeria/West Africa Time)
    # Final nightly settlement after ALL matches of the day are done
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  nightly-settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📡 Trigger Nightly Full Settlement
        run: |
          echo "🌙 Triggering Mivaj nightly full settlement at $(date)"
          AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET || 'mivaj_secure_cron_2026' }}"

          response=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://mivaj.com/api/cron/telegram-settle" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "$AUTH_HEADER" \
            --max-time 120 || echo "000")
          
          echo "Primary response code: $response"
          cat response.json || true
          echo ""

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "⚠️ Primary failed ($response). Retrying via direct Vercel origin..."
            curl -s -X GET "https://aurascore-ai.vercel.app/api/cron/telegram-settle" \
              -H "Accept: application/json" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
              -H "$AUTH_HEADER" \
              --max-time 120 || true
          fi

      - name: 📡 Update data cache for tomorrow
        run: |
          echo "🔄 Pre-loading tomorrow's data..."
          curl -s -X GET "https://mivaj.com/api/cron/update-data" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-time 60 || echo "Data update triggered"
