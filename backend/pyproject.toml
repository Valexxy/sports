[project]
name = "mivaj-backend"
version = "0.1.0"
description = "Mivaj.com Sports Wiki, Birthday Pro Moderation & Notification Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "supabase>=2.3.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.14.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
